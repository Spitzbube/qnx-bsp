# version of the BSP. A folder by this name will be created under scripts/bsp folder.
[bsp]
version = BSP_ti-j722s-evm_br-hw-rel_be-800_SVN997772_JBN64
repo    = bsp_800_j722s

# For newer BSPs we would have to figure the exact files initially.
# Incremental updates can be done by modifying this ini file.
[folders]

# folders that should be created within the top level BSP folder
# Generally a subset of the folders that show up for an existing BSP folder under scripts
# find BSP_ti-j722s-evm_br-hw-rel_be-800_SVN997772_JBN64 -type d | cut -d / -f2-
create = images
	src/hardware/flash/mtd-snor
	src/hardware/flash/mtd-snor/soc/j7ospi
	src/hardware/startup/boards/ti-j7/j722s/evm
	src/hardware/devb/sdmmc/aarch64/am65x.le

# folders that can be copied as is
# NOTE:: Ensure that the path __DOES_NOT__ end with a '/"
copy = etc

# List of files that needs to be copied
[files]
add =   Makefile
	images/Makefile
	images/j722s-evm.build
	images/j722s-evm-ti.build
	src/hardware/flash/mtd-snor/common.mk
	src/hardware/flash/mtd-snor/soc/j7ospi/extra-ti.mk
	src/hardware/devb/sdmmc/aarch64/am65x.le/bs.c
	src/hardware/startup/boards/ti-j7/j722s/evm/hw_init.c



# Files that should be removed. Helpful in case we need
# to copy a whole directory by just delete 1 file from it.
delete =

#END

